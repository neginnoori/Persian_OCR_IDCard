[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-id-ocr"
version = "0.2.0"
description = "DINO/SAM extraction, Paddle text detection and Hezar Persian recognition"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<4","cardid-extractor==0.1.0", "hezar==1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

