[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-card-ocr"
version = "0.1.1"
description = "Field OCR for aligned Iranian ID cards with Paddle detection and Hezar recognition"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<2.3", "Pillow>=10,<13", "opencv-python-headless>=4.10,<4.13"]

[project.optional-dependencies]
models = [
  "numpy==1.26.4", "Pillow==11.3.0", "opencv-python-headless==4.11.0.86",
  "paddlepaddle==3.2.2", "paddleocr==3.3.2", "paddlex==3.3.10",
  "hezar==1.0.0", "torch==2.7.1", "torchvision==0.22.1",
  "transformers==4.57.6", "huggingface-hub==0.36.2",
]

[project.scripts]
persian-ocr = "persian_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
persian_ocr = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
