name: Windows API contract tests
on:
  push:
    branches: [feat/windows-fastapi]
  pull_request:
    paths: ['projects/windows-fastapi/**', '.github/workflows/windows-api-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API test profile (no GPU models)
        run: python -m pip install -r requirements-test.txt
        working-directory: projects/windows-fastapi
      - name: Run API contract tests
        run: python -m pytest tests -q
        working-directory: projects/windows-fastapi
